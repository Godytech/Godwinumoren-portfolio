<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Admin CMS</title>
    <meta name="description" content="Animated professional portfolio with an integrated admin CMS dashboard for full CRUD content management and live updates." />
    <meta property="og:title" content="Portfolio Admin CMS" />
    <meta property="og:description" content="Animated professional portfolio with an integrated admin CMS dashboard for full CRUD content management and live updates." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          if (theme === "dark" || !theme) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
